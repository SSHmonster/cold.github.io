<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ColdCoding</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        .telegram {
            background: #0088cc;
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            display: inline-block;
            margin: 20px 0;
            font-weight: bold;
        }
        .services {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 30px 0;
        }
        .service {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>ColdCoding</h1>
        <p>Профессиональная разработка</p>
        
        <div class="services">
            <div class="service">Python</div>
            <div class="service">Telegram боты</div>
            <div class="service">Парсинг</div>
            <div class="service">Автоматизация</div>
        </div>
        
        <a href="https://t.me/cold_812" class="telegram">Написать в Telegram</a>
        <p style="color: #666; margin-top: 20px;">@cold_812</p>
    </div>
</body>
</html>
